<!DOCTYPE html>
<html class="light" lang="fr">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Connexion Portail Citoyen | Ambassade du Congo en Russie</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#009543",
            "primary-dark": "#111821",
            "accent-gold": "#fcde4a",
            "accent-red": "#C23E28",
            "accent-green": "#009543",
            "background-light": "#f1f5f9",
            "background-dark": "#111821",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style type="text/tailwindcss">
    .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            @apply bg-white dark:bg-gray-900 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-800 w-full max-w-md p-8 md:p-10;
        }
        .input-group label {
            @apply block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2;
        }
        .input-field {
            @apply w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-accent-green focus:border-transparent outline-none transition-all text-gray-900 dark:text-white;
        }
    </style>
</head>

<body
  class="font-display bg-background-light dark:bg-background-dark text-[#111418] dark:text-white min-h-screen flex flex-col items-center justify-center p-6">
  <div class="login-card flex flex-col items-center">
    <div
      class="size-20 bg-white rounded-full flex items-center justify-center p-2 shadow-sm mb-6 border border-gray-100 overflow-hidden">
      <img alt="Coat of arms of the Republic of Congo" class="w-full h-full object-contain"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuC5u2tfTYzp6PRTXTYN8tY5KmaUweUJFTteZFyL3qxAjnrH3fVSTUEjUaKoX7WCgGLaiLZdATJA5Z_N1MDeTZzoM-LK5xDW8jluSHyc9uuQISq6Yi3XdF5QPUUoHok_1xyJdBBt-u44fgP9nP78D44lP5GANN4o-7VkoSkqdBhtKnNNs7-2FVHvWc7wHQuc4Dmn126X2XVvXhi7ucpa_1RVnyeusd6P0loFJcOInQgmuE8brJ1eLKvWpInZx_3g7bHo97frUXtHqXM" />
    </div>
    <div class="text-center mb-10">
      <h1 class="text-2xl font-black text-primary-dark dark:text-white mb-2">Connexion Portail Citoyen</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm">Accédez à votre espace sécurisé</p>
    </div>
    <form class="w-full flex flex-col gap-6">
      <div class="input-group">
        <label for="email">Email / Identifiant Consulaire</label>
        <input class="input-field" id="email" name="email" placeholder="ex: jean.paul@example.com" required=""
          type="text" />
      </div>
      <div class="input-group">
        <div class="flex justify-between items-center mb-2">
          <label class="mb-0" for="password">Mot de passe</label>
        </div>
        <input class="input-field" id="password" name="password" placeholder="••••••••" required="" type="password" />
      </div>
      <a href="./residant/home.html"
        class="w-full py-4 bg-accent-green hover:bg-opacity-90 text-accent-gold font-bold rounded-xl shadow-lg shadow-accent-green/20 transition-all flex items-center justify-center gap-2 mt-2"
        type="submit">
        <span class="material-symbols-outlined">login</span>
        Se connecter
      </a>
      <div class="text-center">
        <a class="text-sm font-semibold text-accent-gold hover:underline" href="#">Mot de passe oublié ?</a>
      </div>
    </form>
    <div class="w-full mt-10">
      <div class="relative flex items-center mb-8">
        <div class="flex-grow border-t border-gray-100 dark:border-gray-800"></div>
        <span class="mx-4 text-xs text-gray-400 uppercase tracking-widest">Nouveau résident</span>
        <div class="flex-grow border-t border-gray-100 dark:border-gray-800"></div>
      </div>
      <div class="text-center">
        <a class="text-sm font-bold text-primary-dark dark:text-accent-gold hover:underline"
          href="./registration/step1.html">
          Pas encore enregistré ? Créer un compte
        </a>
      </div>
    </div>
  </div>
  <div class="mt-8 flex items-center gap-2 text-gray-400 dark:text-gray-500">
    <span class="material-symbols-outlined text-sm">lock</span>
    <span class="text-[10px] font-bold uppercase tracking-widest">Connexion Sécurisée SSL</span>
  </div>

</body>

</html>
